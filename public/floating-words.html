<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smooth Floating Words</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background: transparent;
    "
  >
    <div
      id="wordCanvas"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: transparent;
      "
    ></div>

    <script>
      // ============================================================================
      // THEME MANAGEMENT - INLINE STYLES ONLY
      // ============================================================================
      let currentTheme = 'dark'

      // Apply theme using inline styles only
      function applyTheme(theme) {
        currentTheme = theme

        // Apply color to all existing words with inline styles
        const color = theme === 'light' ? '#000000' : '#ffffff'
        document.querySelectorAll('.floating-word').forEach((word) => {
          word.style.color = color
        })
      }

      // Listen for theme changes from parent
      window.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'THEME_CHANGE') {
          applyTheme(event.data.theme)
        }
      })

      // Apply dark theme immediately on load
      applyTheme('dark')

      // ============================================================================
      // CONFIGURATION
      // ============================================================================
      const CONFIG = {
        WORDS: [
          'kubernetes',
          'rediscluster',
          'reconcilers',
          'kubectl',
          'goroutines',
          'channels',
          'mutex',
          'fanin',
          'kafka',
          'postgres',
          'webSockets',
          'pipelines',
          'atomic',
          'waitGroup',
          'leakybucket',
          'timeouts',
          'bulkheads',
          'idempotency',
          'contextcancellation',
          'DNS',
          'CDN',
          'docker',
          'HTTP',
          'gRPC',
          'pools',
          'solidity',
          'typescript',
          'react',
          'SOLID',
          'indexing',
          'sharding',
          'memcached',
          'latency',
          'throughput',
          'webhooks',
          'graphQL',
        ],

        // Animation settings
        FRAME_RATE: 60,
        OPACITY_STEPS: 10,
        TRANSITION_DURATION: 2000,

        // Word lifecycle (5 seconds total)
        LIFESPAN: 5000,
        FADE_IN_DURATION: 2000,
        VISIBLE_DURATION: 1000,
        FADE_OUT_DURATION: 2000,

        // Generation settings
        GENERATION_RATE: 200,
        MAX_WORDS: 40,
        MIN_WORDS: 40,

        // Movement settings
        MIN_SPEED: 0.2,
        MAX_SPEED: 0.5,
        DRIFT_VARIATION: 0.1,
      }

      // ============================================================================
      // UTILITY FUNCTIONS
      // ============================================================================

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value))
      }

      function easeInOut(t) {
        return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t
      }

      function getRandomItem(array) {
        return array[Math.floor(Math.random() * array.length)]
      }

      function randomBetween(min, max) {
        return Math.random() * (max - min) + min
      }

      function getRandomPosition(edgeBias = 0.3) {
        // 30% chance to spawn from edges
        if (Math.random() < edgeBias) {
          const side = Math.floor(Math.random() * 4)
          switch (side) {
            case 0:
              return {
                x: randomBetween(0, window.innerWidth),
                y: -50,
              }
            case 1:
              return {
                x: window.innerWidth + 50,
                y: randomBetween(0, window.innerHeight),
              }
            case 2:
              return {
                x: randomBetween(0, window.innerWidth),
                y: window.innerHeight + 50,
              }
            case 3:
              return {
                x: -50,
                y: randomBetween(0, window.innerHeight),
              }
          }
        }

        // Random position anywhere
        return {
          x: randomBetween(0, window.innerWidth),
          y: randomBetween(0, window.innerHeight),
        }
      }

      // ============================================================================
      // OPACITY MANAGEMENT
      // ============================================================================

      function setOpacity(element, opacity) {
        // Direct opacity setting without classes
        element.style.opacity = opacity
      }

      // ============================================================================
      // WORD CREATION - INLINE STYLES ONLY
      // ============================================================================

      function createWord() {
        // Check word limit
        if (activeWords.length >= CONFIG.MAX_WORDS) {
          return null
        }

        // Create DOM element with ALL inline styles
        const wordElement = document.createElement('div')

        // ALL STYLES INLINE - no CSS classes
        wordElement.style.cssText = `
          position: absolute;
          font-family: 'Courier New', monospace;
          font-weight: 300;
          font-size: 10px;
          pointer-events: none;
          user-select: none;
          white-space: nowrap;
          opacity: 0;
          will-change: transform, opacity;
          transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
          letter-spacing: 1px;
          transform: translateZ(0);
          color: ${currentTheme === 'light' ? '#000000' : '#ffffff'};
        `

        wordElement.textContent = getRandomItem(CONFIG.WORDS)

        // Get random position
        const position = getRandomPosition()

        // Set initial position
        wordElement.style.left = `${position.x}px`
        wordElement.style.top = `${position.y}px`

        // Add to DOM
        wordCanvas.appendChild(wordElement)

        // Calculate timing for 5-second lifespan
        const now = Date.now()
        const wordObject = {
          element: wordElement,
          x: position.x,
          y: position.y,
          speedX:
            randomBetween(CONFIG.MIN_SPEED, CONFIG.MAX_SPEED) *
            (Math.random() > 0.5 ? 1 : -1),
          speedY:
            randomBetween(CONFIG.MIN_SPEED, CONFIG.MAX_SPEED) *
            (Math.random() > 0.5 ? 1 : -1),

          // Lifecycle timing
          createdAt: now,
          fadeInEnd: now + CONFIG.FADE_IN_DURATION,
          fadeOutStart: now + CONFIG.FADE_IN_DURATION + CONFIG.VISIBLE_DURATION,
          expiresAt: now + CONFIG.LIFESPAN,

          // Current state
          state: 'fadingIn',
          currentOpacity: 0,
        }

        // Add to active words
        activeWords.push(wordObject)

        return wordObject
      }

      function updateWordOpacity(word, currentTime) {
        if (word.state === 'fadingIn') {
          const progress =
            (currentTime - word.createdAt) / CONFIG.FADE_IN_DURATION
          const easedProgress = easeInOut(clamp(progress, 0, 1))

          word.currentOpacity = easedProgress
          setOpacity(word.element, word.currentOpacity)

          if (currentTime >= word.fadeInEnd) {
            word.state = 'visible'
            word.currentOpacity = 1
            setOpacity(word.element, 1)
          }
        } else if (word.state === 'visible') {
          if (word.currentOpacity !== 1) {
            word.currentOpacity = 1
            setOpacity(word.element, 1)
          }

          if (currentTime >= word.fadeOutStart) {
            word.state = 'fadingOut'
          }
        } else if (word.state === 'fadingOut') {
          const progress =
            (currentTime - word.fadeOutStart) / CONFIG.FADE_OUT_DURATION
          const easedProgress = easeInOut(clamp(progress, 0, 1))

          word.currentOpacity = 1 - easedProgress
          setOpacity(word.element, word.currentOpacity)

          if (currentTime >= word.expiresAt) {
            word.state = 'expired'
          }
        }
      }

      function removeExpiredWord(word, index) {
        if (word.element.parentNode) {
          word.element.parentNode.removeChild(word.element)
        }
        activeWords.splice(index, 1)
      }

      function startContinuousGeneration() {
        setInterval(() => {
          if (activeWords.length < CONFIG.MIN_WORDS) {
            createWord()
          } else if (
            Math.random() < 0.3 &&
            activeWords.length < CONFIG.MAX_WORDS
          ) {
            createWord()
          }
        }, CONFIG.GENERATION_RATE)
      }

      // ============================================================================
      // ANIMATION LOOP
      // ============================================================================

      let activeWords = []
      const wordCanvas = document.getElementById('wordCanvas')
      let lastFrameTime = 0
      let frameId = null
      const FRAME_TIME = 1000 / CONFIG.FRAME_RATE

      function animationLoop(timestamp) {
        const deltaTime = timestamp - lastFrameTime

        if (deltaTime >= FRAME_TIME) {
          lastFrameTime = timestamp - (deltaTime % FRAME_TIME)
          const currentTime = Date.now()

          for (let i = activeWords.length - 1; i >= 0; i--) {
            const word = activeWords[i]

            updateWordOpacity(word, currentTime)

            if (word.currentOpacity > 0) {
              // Add subtle drifting motion
              const driftTime = currentTime / 1000
              const driftX =
                Math.sin(driftTime * 1.5) *
                CONFIG.DRIFT_VARIATION *
                Math.random()
              const driftY =
                Math.cos(driftTime * 1.0) *
                CONFIG.DRIFT_VARIATION *
                Math.random()

              word.x += word.speedX + driftX
              word.y += word.speedY + driftY

              word.element.style.transform = `translate(${word.x}px, ${word.y}px)`
            }

            if (
              word.state === 'expired' ||
              currentTime > word.expiresAt + 1000
            ) {
              removeExpiredWord(word, i)
            }

            // Boundary wrapping
            const padding = 100
            if (word.x > window.innerWidth + padding) word.x = -padding
            if (word.x < -padding) word.x = window.innerWidth + padding
            if (word.y > window.innerHeight + padding) word.y = -padding
            if (word.y < -padding) word.y = window.innerHeight + padding
          }
        }

        frameId = requestAnimationFrame(animationLoop)
      }

      function startAnimation() {
        lastFrameTime = performance.now()
        frameId = requestAnimationFrame(animationLoop)
      }

      function handleResize() {
        activeWords.forEach((word) => {
          if (word.x > window.innerWidth) word.x = window.innerWidth - 100
          if (word.y > window.innerHeight) word.y = window.innerHeight - 100
          if (word.x < 0) word.x = 100
          if (word.y < 0) word.y = 100
        })
      }

      function init() {
        // Create initial words
        const initialCount = Math.min(CONFIG.MIN_WORDS + 20, CONFIG.MAX_WORDS)
        for (let i = 0; i < initialCount; i++) {
          createWord()
        }

        startContinuousGeneration()
        startAnimation()
        window.addEventListener('resize', handleResize)
      }

      function cleanup() {
        if (frameId) {
          cancelAnimationFrame(frameId)
        }

        activeWords.forEach((word) => {
          if (word.element.parentNode) {
            word.element.parentNode.removeChild(word.element)
          }
        })

        activeWords.length = 0
      }

      // ============================================================================
      // START SYSTEM
      // ============================================================================

      // Start immediately
      init()

      window.addEventListener('beforeunload', cleanup)
    </script>
  </body>
</html>
